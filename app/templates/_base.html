<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}{% endblock %}{% if self.title() %} — {% endif %}{{ shop_name }}</title>
    <link rel="preload" href="{{ url_for('static', filename='fonts/Barlow-Regular.woff') }}" as="font" type="font/woff" crossorigin>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e7c86'/%3E%3Cpath d='M16 6c-4 6-7 9.5-7 13a7 7 0 0 0 14 0c0-3.5-3-7-7-13z' fill='white'/%3E%3C/svg%3E">
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}" hx-headers='{"X-CSRFToken": "{{ csrf_token() }}"}'>
{% block body %}{% endblock %}
<script src="{{ url_for('static', filename='bootstrap.bundle.js') }}"></script>
<script src="{{ url_for('static', filename='htmx.min.js') }}"></script>
{% block admin_scripts %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
